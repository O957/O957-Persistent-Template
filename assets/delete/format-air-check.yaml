
on:
  push:
    branches: [main, master]
  pull_request:

name: "Run Air Format Check"


permissions: read-all

jobs:
  format-check:
    name: "Air Format Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install Air"
        uses: posit-dev/setup-air@v1

      - name: "Check"
        run: air format . --check
