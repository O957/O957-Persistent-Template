version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      actions:
        patterns:
          - "*"
    reviewers:
      - "O957"
    assignees:
      - "O957"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    pull-request-branch-name:
      separator: "-"
    labels:
      - "Automation"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    reviewers:
      - "O957"
    assignees:
      - "O957"
    pull-request-branch-name:
      separator: "-"
    labels:
      - "Dependencies"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    reviewers:
      - "O957"
    assignees:
      - "O957"
    pull-request-branch-name:
      separator: "-"
    labels:
      - "Dependencies"
